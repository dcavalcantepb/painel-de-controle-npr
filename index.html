<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Painel de Controle NPR</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📋</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E6EBF2; --surface:#FFFFFF; --ink:#1B2A41; --muted:#56667E; --line:#C9D2DF;
  --accent:#F2C14E; --accent-ink:#3A2A00; --danger:#B3261E;
  --radius-lg:14px; --radius-sm:8px;
  --ui:"Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
  --display:"Bricolage Grotesque", "Atkinson Hyperlegible", system-ui, sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#131A25; --surface:#1D2634; --ink:#E6ECF5; --muted:#9AA8BC; --line:#2E3A4D;
    --danger:#FF8A80; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#131A25; --surface:#1D2634; --ink:#E6ECF5; --muted:#9AA8BC; --line:#2E3A4D;
  --danger:#FF8A80; color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0; background:var(--bg); color:var(--ink); font-family:var(--ui); font-size:16px; line-height:1.45}
button,input,textarea,select{font:inherit; color:inherit}
:focus-visible{outline:3px solid var(--accent); outline-offset:2px}

.wrap{max-width:1100px; margin:0 auto; padding:24px 20px 64px}

header{display:flex; flex-wrap:wrap; align-items:flex-end; gap:16px; justify-content:space-between; margin-bottom:20px}
h1{font-family:var(--display); font-weight:800; font-size:clamp(28px,5vw,40px); line-height:1; margin:0; letter-spacing:-0.02em}
.sub{margin:6px 0 0; color:var(--muted); font-size:15px}
.actions{display:flex; gap:8px; flex-wrap:wrap; align-items:center}

.btn{border:1px solid var(--line); background:var(--surface); border-radius:999px; padding:8px 14px; cursor:pointer; font-size:14px}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--ink); color:var(--bg); border-color:var(--ink)}
.btn.on{background:var(--accent); color:var(--accent-ink); border-color:var(--accent); font-weight:700}
.btn.danger{color:var(--danger)}

.search{flex:1 1 220px; max-width:320px; border:1px solid var(--line); background:var(--surface); border-radius:999px; padding:8px 14px}

/* Abas */
.tabs{display:flex; gap:4px; overflow-x:auto; border-bottom:2px solid var(--line); margin-bottom:6px; scrollbar-width:thin}
.tab{flex:0 0 auto; border:0; background:none; padding:10px 16px 12px; cursor:pointer; color:var(--muted); font-weight:700; position:relative; border-radius:var(--radius-sm) var(--radius-sm) 0 0}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--ink)}
.tab[aria-selected="true"]::after{content:""; position:absolute; left:10px; right:10px; bottom:-2px; height:5px; background:var(--accent); border-radius:3px 3px 0 0}
.tab .count{font-weight:400; font-size:13px; margin-left:6px; opacity:.75}
.tab.add{color:var(--muted); font-weight:400}

.tabtools{display:flex; flex-wrap:wrap; gap:8px; margin:12px 0 4px}

/* Grade de botões */
.grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:12px; margin-top:18px}
.card{position:relative; display:flex; flex-direction:column; background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-lg); overflow:hidden}
.copy{flex:1; text-align:left; border:0; background:none; padding:16px 16px 14px; cursor:pointer; display:flex; flex-direction:column; gap:6px; min-height:96px}
.copy:hover{background:color-mix(in srgb, var(--accent) 12%, transparent)}
.label{font-weight:700; font-size:16px}
.preview{color:var(--muted); font-size:14px; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; white-space:pre-line}
.from{font-size:12px; color:var(--muted)}
.card .done{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; background:var(--accent); color:var(--accent-ink); font-family:var(--display); font-weight:800; font-size:22px; opacity:0; pointer-events:none; transition:opacity .15s}
.card.copied .done{opacity:1}
.tools{display:flex; border-top:1px solid var(--line)}
.tools button{flex:1; border:0; background:none; padding:8px 4px; cursor:pointer; font-size:13px; color:var(--muted)}
.tools button:hover{color:var(--ink); background:color-mix(in srgb, var(--line) 40%, transparent)}
.tools button + button{border-left:1px solid var(--line)}
.tools .del:hover{color:var(--danger)}
.newcard{border:2px dashed var(--line); background:transparent; border-radius:var(--radius-lg); min-height:96px; cursor:pointer; color:var(--muted); font-weight:700}
.newcard:hover{border-color:var(--muted); color:var(--ink)}

.empty{margin-top:28px; padding:28px; border:2px dashed var(--line); border-radius:var(--radius-lg); color:var(--muted); text-align:center}

/* Diálogos */
dialog{border:1px solid var(--line); border-radius:var(--radius-lg); background:var(--surface); color:var(--ink); padding:0; width:min(560px, calc(100% - 32px))}
dialog::backdrop{background:rgba(10,15,25,.5)}
dialog form{padding:22px; display:flex; flex-direction:column; gap:14px}
dialog h2{font-family:var(--display); font-weight:600; margin:0; font-size:22px}
label.f{display:flex; flex-direction:column; gap:6px; font-weight:700; font-size:14px}
label.f input, label.f textarea, label.f select{font-weight:400; border:1px solid var(--line); background:var(--bg); border-radius:var(--radius-sm); padding:10px 12px; font-size:15px}
label.f textarea{min-height:200px; resize:vertical; line-height:1.5}
.dlg-actions{display:flex; gap:8px; justify-content:flex-end; flex-wrap:wrap}
.dlg-actions .spacer{flex:1}

.toast{position:fixed; left:50%; bottom:calc(20px + env(safe-area-inset-bottom,0px)); transform:translateX(-50%) translateY(20px); background:var(--ink); color:var(--bg); padding:10px 18px; border-radius:999px; font-size:14px; opacity:0; transition:opacity .2s, transform .2s; pointer-events:none; max-width:calc(100% - 32px)}
.toast.show{opacity:1; transform:translateX(-50%) translateY(0)}

footer{margin-top:40px; color:var(--muted); font-size:13px; display:flex; flex-wrap:wrap; gap:8px; align-items:center}
.visually-hidden{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0)}

@media (prefers-reduced-motion: reduce){ *{transition:none !important} }
@media (max-width:560px){ .wrap{padding:16px 14px 48px} .search{max-width:none} }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Textos padrão</h1>
      <p class="sub">Clique em um botão para copiar o texto.</p>
    </div>
    <div class="actions">
      <input id="search" class="search" type="search" placeholder="Buscar em todas as seções ( / )" aria-label="Buscar textos">
      <button id="editToggle" class="btn" aria-pressed="false">Editar</button>
    </div>
  </header>

  <nav class="tabs" id="tabs" role="tablist" aria-label="Seções"></nav>
  <div class="tabtools" id="tabtools" hidden>
    <button class="btn" data-act="tab-left">Mover seção para a esquerda</button>
    <button class="btn" data-act="tab-right">Mover seção para a direita</button>
    <button class="btn" data-act="tab-rename">Renomear seção</button>
    <button class="btn danger" data-act="tab-delete">Excluir seção</button>
  </div>

  <main id="grid" class="grid" aria-live="polite"></main>
  <div id="empty" class="empty" hidden></div>

  <footer>
    <span>Os textos ficam salvos neste navegador. Faça backup de vez em quando.</span>
    <button class="btn" id="exportBtn">Exportar backup</button>
    <button class="btn" id="importBtn">Importar backup</button>
    <button class="btn" id="themeBtn">Tema</button>
    <input type="file" id="importFile" accept="application/json,.json" class="visually-hidden">
  </footer>
</div>

<dialog id="itemDlg">
  <form method="dialog" id="itemForm">
    <h2 id="itemTitle">Novo texto</h2>
    <label class="f">Nome do botão
      <input id="itemLabel" required maxlength="80" autocomplete="off">
    </label>
    <label class="f">Texto a copiar
      <textarea id="itemText" required></textarea>
    </label>
    <label class="f">Seção
      <select id="itemTab"></select>
    </label>
    <div class="dlg-actions">
      <button type="button" class="btn danger" id="itemDelete">Excluir</button>
      <span class="spacer"></span>
      <button type="button" class="btn" id="itemCancel">Cancelar</button>
      <button type="submit" class="btn primary">Salvar</button>
    </div>
  </form>
</dialog>

<dialog id="tabDlg">
  <form method="dialog" id="tabForm">
    <h2 id="tabTitle">Nova seção</h2>
    <label class="f">Nome da seção
      <input id="tabName" required maxlength="40" autocomplete="off">
    </label>
    <div class="dlg-actions">
      <button type="button" class="btn" id="tabCancel">Cancelar</button>
      <button type="submit" class="btn primary">Salvar</button>
    </div>
  </form>
</dialog>

<div class="toast" id="toast" role="status"></div>

<script>
(function(){
  const KEY = 'textos-padrao:v1';
  const THEME_KEY = 'textos-padrao:tema';
  const $ = (id) => document.getElementById(id);

  const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);

  function seed(){
    const t1 = uid(), t2 = uid();
    return {
      version: 1,
      active: t1,
      tabs: [
        { id: t1, name: 'E-mails', items: [
          { id: uid(), label: 'Saudação', text: 'Prezados(as),\n\nBom dia.\n\n' },
          { id: uid(), label: 'Encerramento', text: 'Permaneço à disposição para quaisquer esclarecimentos.\n\nAtenciosamente,' },
          { id: uid(), label: 'Confirmação de recebimento', text: 'Acuso o recebimento da mensagem e informo que a demanda já está em análise.' }
        ]},
        { id: t2, name: 'Despachos', items: [
          { id: uid(), label: 'Encaminhamento', text: 'Encaminho para conhecimento e providências cabíveis.' },
          { id: uid(), label: 'Arquivamento', text: 'Cumpridas as providências, arquive-se.' }
        ]}
      ]
    };
  }

  function valid(d){
    return d && Array.isArray(d.tabs) && d.tabs.every(t =>
      t && typeof t.name === 'string' && Array.isArray(t.items) &&
      t.items.every(i => i && typeof i.label === 'string' && typeof i.text === 'string'));
  }

  function normalize(d){
    d.tabs.forEach(t => { t.id = t.id || uid(); t.items.forEach(i => { i.id = i.id || uid(); }); });
    if (!d.tabs.some(t => t.id === d.active)) d.active = d.tabs[0] ? d.tabs[0].id : null;
    return d;
  }

  function load(){
    try {
      const raw = localStorage.getItem(KEY);
      if (raw) { const d = JSON.parse(raw); if (valid(d)) return normalize(d); }
    } catch (e) {}
    return seed();
  }

  let state = load();
  let editMode = false;
  let query = '';

  function save(){
    try { localStorage.setItem(KEY, JSON.stringify(state)); }
    catch (e) { toast('Não foi possível salvar neste navegador.'); }
  }

  const activeTab = () => state.tabs.find(t => t.id === state.active) || null;

  // ---------- Área de transferência ----------
  async function copyText(text){
    try {
      await navigator.clipboard.writeText(text);
      return true;
    } catch (e) {
      const ta = document.createElement('textarea');
      ta.value = text; ta.setAttribute('readonly', '');
      ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select();
      let ok = false;
      try { ok = document.execCommand('copy'); } catch (err) {}
      ta.remove();
      return ok;
    }
  }

  let toastTimer;
  function toast(msg){
    const el = $('toast');
    el.textContent = msg; el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove('show'), 2200);
  }

  // ---------- Renderização ----------
  function el(tag, props, ...children){
    const n = document.createElement(tag);
    if (props) for (const [k, v] of Object.entries(props)) {
      if (k === 'class') n.className = v;
      else if (k.startsWith('on')) n.addEventListener(k.slice(2), v);
      else if (v !== undefined && v !== null) n.setAttribute(k, v);
    }
    children.flat().forEach(c => { if (c != null) n.append(c); });
    return n;
  }

  function renderTabs(){
    const nav = $('tabs'); nav.replaceChildren();
    state.tabs.forEach(t => {
      const selected = !query && t.id === state.active;
      nav.append(el('button', {
        class: 'tab', role: 'tab', 'aria-selected': String(selected),
        onclick: () => { state.active = t.id; query = ''; $('search').value = ''; save(); render(); }
      }, t.name, el('span', { class: 'count' }, String(t.items.length))));
    });
    if (editMode) nav.append(el('button', { class: 'tab add', onclick: () => openTabDialog(null) }, '+ Nova seção'));
    $('tabtools').hidden = !(editMode && activeTab() && !query);
  }

  function card(item, tab, showFrom){
    const done = el('span', { class: 'done', 'aria-hidden': 'true' }, 'Copiado');
    const c = el('div', { class: 'card' });
    const btn = el('button', {
      class: 'copy', title: 'Copiar "' + item.label + '"',
      onclick: async () => {
        const ok = await copyText(item.text);
        if (ok) {
          c.classList.add('copied');
          setTimeout(() => c.classList.remove('copied'), 700);
          toast('Copiado: ' + item.label);
        } else {
          toast('Não foi possível copiar. Tente novamente.');
        }
      }
    },
      el('span', { class: 'label' }, item.label),
      el('span', { class: 'preview' }, item.text),
      showFrom ? el('span', { class: 'from' }, tab.name) : null
    );
    c.append(btn, done);
    if (editMode) {
      const idx = tab.items.indexOf(item);
      c.append(el('div', { class: 'tools' },
        el('button', { 'aria-label': 'Mover para trás', title: 'Mover para trás', onclick: () => moveItem(tab, idx, -1) }, '←'),
        el('button', { 'aria-label': 'Mover para frente', title: 'Mover para frente', onclick: () => moveItem(tab, idx, 1) }, '→'),
        el('button', { onclick: () => openItemDialog(item, tab) }, 'Editar'),
        el('button', { class: 'del', onclick: () => deleteItem(tab, item) }, 'Excluir')
      ));
    }
    return c;
  }

  function renderGrid(){
    const grid = $('grid'), empty = $('empty');
    grid.replaceChildren();
    let count = 0;

    if (query) {
      const q = query.toLowerCase();
      state.tabs.forEach(t => t.items.forEach(i => {
        if (i.label.toLowerCase().includes(q) || i.text.toLowerCase().includes(q)) {
          grid.append(card(i, t, true)); count++;
        }
      }));
      empty.hidden = count > 0;
      empty.textContent = 'Nenhum texto encontrado para "' + query + '".';
      return;
    }

    const tab = activeTab();
    if (!tab) {
      empty.hidden = false;
      empty.textContent = 'Nenhuma seção ainda. Clique em Editar e depois em "+ Nova seção".';
      return;
    }
    tab.items.forEach(i => { grid.append(card(i, tab, false)); count++; });
    if (editMode) grid.append(el('button', { class: 'newcard', onclick: () => openItemDialog(null, tab) }, '+ Adicionar texto'));
    empty.hidden = count > 0 || editMode;
    empty.textContent = 'Esta seção está vazia. Clique em Editar para adicionar o primeiro texto.';
  }

  function render(){ renderTabs(); renderGrid(); }

  // ---------- Itens ----------
  function moveItem(tab, idx, dir){
    const j = idx + dir;
    if (j < 0 || j >= tab.items.length) return;
    [tab.items[idx], tab.items[j]] = [tab.items[j], tab.items[idx]];
    save(); render();
  }

  function deleteItem(tab, item){
    if (!confirm('Excluir o texto "' + item.label + '"?')) return;
    tab.items = tab.items.filter(i => i !== item);
    save(); render(); toast('Texto excluído');
  }

  let editing = null; // { item, tab }
  function openItemDialog(item, tab){
    editing = { item, tab };
    $('itemTitle').textContent = item ? 'Editar texto' : 'Novo texto';
    $('itemLabel').value = item ? item.label : '';
    $('itemText').value = item ? item.text : '';
    const sel = $('itemTab'); sel.replaceChildren();
    state.tabs.forEach(t => sel.append(el('option', { value: t.id }, t.name)));
    sel.value = tab.id;
    $('itemDelete').hidden = !item;
    $('itemDlg').showModal();
    $('itemLabel').focus();
  }

  $('itemForm').addEventListener('submit', (e) => {
    e.preventDefault();
    const label = $('itemLabel').value.trim();
    const text = $('itemText').value;
    if (!label || !text.trim()) return;
    const target = state.tabs.find(t => t.id === $('itemTab').value) || editing.tab;
    if (editing.item) {
      editing.item.label = label; editing.item.text = text;
      if (target !== editing.tab) {
        editing.tab.items = editing.tab.items.filter(i => i !== editing.item);
        target.items.push(editing.item);
      }
    } else {
      target.items.push({ id: uid(), label, text });
    }
    save(); $('itemDlg').close(); render();
    toast(editing.item ? 'Alterações salvas' : 'Texto adicionado');
  });
  $('itemCancel').addEventListener('click', () => $('itemDlg').close());
  $('itemDelete').addEventListener('click', () => {
    const { item, tab } = editing;
    $('itemDlg').close();
    deleteItem(tab, item);
  });

  // ---------- Seções ----------
  let editingTab = null;
  function openTabDialog(tab){
    editingTab = tab;
    $('tabTitle').textContent = tab ? 'Renomear seção' : 'Nova seção';
    $('tabName').value = tab ? tab.name : '';
    $('tabDlg').showModal();
    $('tabName').focus();
  }
  $('tabForm').addEventListener('submit', (e) => {
    e.preventDefault();
    const name = $('tabName').value.trim();
    if (!name) return;
    if (editingTab) editingTab.name = name;
    else { const t = { id: uid(), name, items: [] }; state.tabs.push(t); state.active = t.id; }
    save(); $('tabDlg').close(); render();
  });
  $('tabCancel').addEventListener('click', () => $('tabDlg').close());

  $('tabtools').addEventListener('click', (e) => {
    const act = e.target.dataset.act; const tab = activeTab();
    if (!act || !tab) return;
    const idx = state.tabs.indexOf(tab);
    if (act === 'tab-rename') openTabDialog(tab);
    if (act === 'tab-left' || act === 'tab-right') {
      const j = idx + (act === 'tab-left' ? -1 : 1);
      if (j < 0 || j >= state.tabs.length) return;
      [state.tabs[idx], state.tabs[j]] = [state.tabs[j], state.tabs[idx]];
      save(); render();
    }
    if (act === 'tab-delete') {
      const n = tab.items.length;
      const msg = n ? 'Excluir a seção "' + tab.name + '" e seus ' + n + ' texto(s)?' : 'Excluir a seção "' + tab.name + '"?';
      if (!confirm(msg)) return;
      state.tabs.splice(idx, 1);
      state.active = state.tabs[Math.max(0, idx - 1)] ? state.tabs[Math.max(0, idx - 1)].id : null;
      save(); render(); toast('Seção excluída');
    }
  });

  // ---------- Controles gerais ----------
  $('editToggle').addEventListener('click', () => {
    editMode = !editMode;
    const b = $('editToggle');
    b.classList.toggle('on', editMode);
    b.setAttribute('aria-pressed', String(editMode));
    b.textContent = editMode ? 'Concluir edição' : 'Editar';
    render();
  });

  $('search').addEventListener('input', (e) => { query = e.target.value.trim(); render(); });
  document.addEventListener('keydown', (e) => {
    const typing = /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName);
    if (e.key === '/' && !typing) { e.preventDefault(); $('search').focus(); }
    if (e.key === 'Escape' && document.activeElement === $('search')) { $('search').value = ''; query = ''; render(); }
  });

  // Backup
  $('exportBtn').addEventListener('click', () => {
    const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
    const a = document.createElement('a');
    const d = new Date();
    const stamp = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
    a.href = URL.createObjectURL(blob);
    a.download = 'textos-padrao-backup-' + stamp + '.json';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    toast('Backup exportado');
  });
  $('importBtn').addEventListener('click', () => $('importFile').click());
  $('importFile').addEventListener('change', async (e) => {
    const file = e.target.files[0]; e.target.value = '';
    if (!file) return;
    try {
      const d = JSON.parse(await file.text());
      if (!valid(d)) throw new Error('formato');
      if (!confirm('Substituir todos os textos atuais pelos do backup?')) return;
      state = normalize(d); save(); query = ''; $('search').value = ''; render();
      toast('Backup importado');
    } catch (err) {
      toast('Arquivo inválido. Use um backup exportado por esta página.');
    }
  });

  // Tema
  function applyTheme(t){
    if (t) document.documentElement.setAttribute('data-theme', t);
    else document.documentElement.removeAttribute('data-theme');
    $('themeBtn').textContent = t === 'dark' ? 'Tema: escuro' : t === 'light' ? 'Tema: claro' : 'Tema: automático';
  }
  let theme = null;
  try { theme = localStorage.getItem(THEME_KEY); } catch (e) {}
  applyTheme(theme);
  $('themeBtn').addEventListener('click', () => {
    theme = theme === null ? 'light' : theme === 'light' ? 'dark' : null;
    try { theme ? localStorage.setItem(THEME_KEY, theme) : localStorage.removeItem(THEME_KEY); } catch (e) {}
    applyTheme(theme);
  });

  render();
})();
</script>
</body>
</html>
